[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rankingbot"
version = "0.0.0"
dependencies = [
  "mwclient==0.11.0",
]
requires-python = ">= 3.12"

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
]
lint = [
  "yamllint==1.38.0",
]

[project.scripts]
rankingbot = "rankingbot:main"

[tool.setuptools.packages.find]
exclude = ["tmp"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# flake8 ran all of pycodestyle, which ruff leaves off by default.
extend-select = ["E", "W"]
